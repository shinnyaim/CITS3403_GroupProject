<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"/>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='auth.css') }}"/>
</head>

<body>

  <canvas id="cloudCanvas"></canvas>

  <div class="background-container">
    <img src="{{ url_for('static', filename='uwaBG.png') }}" class="bg-image" />
  </div>

  <div class="menu-overlay d-flex flex-column align-items-center justify-content-center min-vh-100 text-center">

    <div class="title-box p-4 rounded mb-4">
      <h1 class="game-title">Group Project Simulator</h1>
    </div>

    <div class="auth-tabs mb-3">
      <button id="loginTab" class="auth-tab active">LOG IN</button>
      <button id="signupTab" class="auth-tab">SIGN UP</button>
    </div>

    <!-- ERROR MESSAGE BOX (REQUIRED FOR SELENIUM) -->
    <div id="loginError" class="error-message">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {{ messages[0] }}
        {% endif %}
      {% endwith %}
    </div>

    <div class="auth-form-box" id="loginForm">
      <form method="POST">
        <input type="hidden" name="action" value="login"/>
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}"/>

        <input type="email"
               id="email"
               name="email"
               class="auth-input"
               placeholder="Email"
               required />

        <input type="password"
               id="password"
               name="password"
               class="auth-input"
               placeholder="Password"
               required />

        <button id="loginBtn" class="auth-submit" type="submit">
          LOGIN
        </button>
      </form>
    </div>

    <!-- SIGNUP FORM -->
    <div class="auth-form-box" id="signupForm" style="display:none;">
      <form method="POST">
        <input type="hidden" name="action" value="signup"/>

        <input type="text"
               name="username"
               class="auth-input"
               placeholder="Username"
               required />

        <input type="email"
               name="email"
               class="auth-input"
               placeholder="Email"
               required />

        <input type="password"
               name="password"
               class="auth-input"
               placeholder="Password"
               required />

        <button class="auth-submit" type="submit">
          JOIN GAME
        </button>
      </form>
    </div>

    <!-- BACK LINK -->
    <a href="{{ url_for('main.index') }}" class="back-link mt-3">
      Back to Menu
    </a>

  </div>

  <!-- SCRIPTS -->
  <script src="{{ url_for('static', filename='clouds.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
