<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body>

<canvas id="cloudCanvas"></canvas>

<div class="background-container">
  <img src="../static/uwaBG.png" class="bg-image">
</div>

<div class="menu-overlay d-flex flex-column align-items-center justify-content-center min-vh-100 text-center">

  <div class="title-box p-4 mb-4">
    <h1 class="game-title">Group Project Simulator</h1>
  </div>

  <!-- Tabs -->
  <div class="auth-tabs mb-3">
    <button id="signupTab" class="auth-tab">SIGN UP</button>
    <button id="loginTab" class="auth-tab active">LOG IN</button>
  </div>

  <!-- Flash -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert flash-alert mb-2">
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  <!-- LOGIN -->
  <div class="auth-form-box" id="loginForm">
    <form method="POST">
      <input type="hidden" name="action" value="login">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

      <input type="email" name="email" class="auth-input" placeholder="Email" required>
      <input type="password" name="password" class="auth-input" placeholder="Password" required>

      <button class="auth-submit" type="submit">LOGIN</button>
    </form> 
  </div>

  <!-- SIGNUP -->
  <div class="auth-form-box" id="signupForm" style="display:none;">
    <form method="POST">
      <input type="hidden" name="action" value="signup">

      <input type="text" name="username" class="auth-input" placeholder="Username" required>
      <input type="email" name="email" class="auth-input" placeholder="Email" required>
      <input type="password" name="password" class="auth-input" placeholder="Password" required>

      <button class="auth-submit">JOIN GAME</button>
    </form>
  </div>

  <a href="{{ url_for('main.index') }}" class="back-link mt-3">Back to Menu</a>

</div>

<script src="{{ url_for('static', filename='clouds.js') }}"></script>
<script src="{{ url_for('static', filename='auth.js') }}"></script>

</body>
</html>
