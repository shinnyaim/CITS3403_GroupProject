<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/static/loading.css" />

    <title>Picking your teammates...</title>
  </head>
  <body>
    <div class="parent">
      <p id="mainTitle">ASSIGNING YOUR TEAMMATES...</p>

      <div class="progress">
        <div
          class="progress-bar"
          id="loadingBar"
          role="progressbar"
          style="width: 25%"
          aria-valuenow="25"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>

      <div class="cardsRow">
        <div class="teammateCard" id="card1">
          <p class="card-emoji">?</p>
          <p class="cardName">???</p>
          <p class="cardRole">Identifying...</p>
          <p class="cardDesc">???</p>
        </div>

        <div class="teammateCard" id="card2">
          <p class="card-emoji">?</p>
          <p class="cardName">???</p>
          <p class="cardRole">Identifying...</p>
          <p class="cardDesc">???</p>
        </div>

        <div class="teammateCard" id="card3">
          <p class="card-emoji">?</p>
          <p class="cardName">???</p>
          <p class="cardRole">Identifying...</p>
          <p class="cardDesc">???</p>
        </div>
      </div>
      <br />
      <button id="beginBtn" onclick="window.location.href = '/game'">
        BEGIN!
      </button>
    </div>
    <script src="/static/loading.js"></script>
  </body>
</html>
