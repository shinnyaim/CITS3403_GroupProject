<!DOCTYPE html>
<html lang="en">    
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Group Project Simulator</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <!-- Pixel-style font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Shared CSS (same file as index.html) -->
  <link rel="stylesheet" href="style2.css">
</head>
<body>
    <canvas id="cloudCanvas"></canvas>
    <div class="background-container">
      <img src="uwa-background.png" alt="Pixel Art Background" class="bg-image">
    </div>
    <div class="menu-overlay d-flex flex-column align-items-center justify-content-center min-vh-100 text-center">
      <div class="title-box p-4 rounded mb-4">
        <h1 class="game-title">Group Project Simulator</h1>
      </div>
    
      <div class="auth-tabs mb-3">
        <button class="auth-tab active" id="loginTab">LOG IN</button>
        <button class="auth-tab" id="signupTab">SIGN UP</button>
      </div>

      <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} flash-alert mb-3">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Login Form-->
     <div class="auth-form-box" id=""loginForm">
      <form method="POST" action="{{ url_for('auth.login') }}">

        <!-- CSRF token Flask-WTF-->
        {{ form.hidden_tag() if form else '' }}
        <input type="hidden" name="action" value="login">
        <input
          type="email"
          name="email"
          placeholder="Email"
          class="auth-input"
          autocomplete="email"
          required
        >
        <input
          type="password"
          name="password"
          placeholder="Password"
          class="auth-input"
          autocomplete="current-password"
          required
        >
        <button type="submit" class="auth-submit">START →</button>
    </form> 
    </div>

    <!-- Sign Up Form (hidden by default) -->
    <div class="auth-form-box" id="signupForm" style="display:none;">
      <form method="POST" action="{{ url_for('auth.login') }}">

        {{ form.hidden_tag() if form else '' }}
        <input type="hidden" name="action" value="signup">

        <input
          type="text"
          name="username"
          placeholder="Username"
          class="auth-input"
          autocomplete="username"
          required
        >
        <input
          type="email"
          name="email"
          placeholder="Email"
          class="auth-input"
          autocomplete="email"
          required
        >
        <input
          type="password"
          name="password"
          placeholder="Password"
          class="auth-input"
          autocomplete="new-password"
          required
        >
        <button type="submit" class="auth-submit">JOIN GAME →</button>
      </form>
    </div>

    <!-- Back to main menu -->
    <a href="{{ url_for('main.index') }}" class="back-link mt-4">← Back to Menu</a>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
